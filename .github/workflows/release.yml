name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    # Keep the release gate aligned with CI and the Python 3.9 support floor.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install --upgrade pip build .[dev]

      - name: Run Ruff
        run: python -m ruff check redfish_sdk

      - name: Compile sources
        run: python -m compileall -q redfish_sdk

      - name: Run offline tests
        run: python -m pytest --ignore=tests/test_real_bmc.py

      - name: Build distributions
        run: python -m build

      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "import redfish_sdk"

  release:
    name: Create Release & Publish to PyPI
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          # Extract the section for current version from CHANGELOG.md
          # Matches everything between ## [x.y.z] and the next ## heading
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, ver)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          # Fall back to auto-generated notes if CHANGELOG section is empty
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi

          # Write to file for the release step (avoids quoting issues)
          echo "$NOTES" > /tmp/release_notes.md

      - name: Build sdist and wheel
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
