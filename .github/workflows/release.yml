name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Python 3.9
    # Keep the release gate aligned with CI and the Python 3.9 support floor.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip build .[dev]

      - name: Run Ruff
        run: python -m ruff check redfish_sdk

      - name: Compile sources
        run: python -m compileall -q redfish_sdk

      - name: Run all offline tests
        run: python -m pytest --ignore=tests/test_real_bmc.py --strict-markers -ra --junitxml=test-results.xml

      - name: Reject skipped offline tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse("test-results.xml")
          skipped = sum(int(suite.get("skipped", "0")) for suite in report.iter("testsuite"))
          if skipped:
              raise SystemExit(f"All offline tests must run; {skipped} tests were skipped")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-python-3.9
          path: test-results.xml

      - name: Build distributions
        run: python -m build

      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "import redfish_sdk"

  release:
    name: Create Release & Publish to PyPI
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build tools
        run: pip install build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          # Extract the section for current version from CHANGELOG.md
          # Matches everything between ## [x.y.z] and the next ## heading
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, ver)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          # Fall back to auto-generated notes if CHANGELOG section is empty
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ github.ref_name }}"
          fi

          # Write to file for the release step (avoids quoting issues)
          echo "$NOTES" > /tmp/release_notes.md

      - name: Build sdist and wheel
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
