name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install --upgrade pip build .[dev]

      - name: Run Ruff
        run: python -m ruff check redfish_sdk

      - name: Compile sources
        run: python -m compileall -q redfish_sdk

      - name: Run offline tests
        run: python -m pytest --ignore=tests/test_real_bmc.py

      - name: Build distributions
        run: python -m build

      - name: Install and import wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "import redfish_sdk"
