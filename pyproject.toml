[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redfish-python-sdk"
version = "1.3.1"
description = "A Python SDK for interacting with Redfish-compliant BMC endpoints"
requires-python = ">=3.9"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "RedNote Infrastructure"},
]
keywords = ["redfish", "bmc", "ipmi", "server", "oob"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/rednote-infra/redfish-python-sdk"
Repository = "https://github.com/rednote-infra/redfish-python-sdk"
Issues = "https://github.com/rednote-infra/redfish-python-sdk/issues"
Changelog = "https://github.com/rednote-infra/redfish-python-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["redfish_sdk*"]

[tool.setuptools.package-data]
redfish_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # Line length is handled by the formatter
    "UP006",  # Keep typing.List for Python 3.9 runtime compatibility
    "UP007",  # Keep typing.Union for Python 3.9 runtime compatibility
    "UP035",  # Keep typing.List for Python 3.9 runtime compatibility
    "UP045",  # Pydantic v2 on Python 3.9 requires Optional
    "SIM105", # Prefer the current form for readability
]

[tool.ruff.lint.isort]
known-first-party = ["redfish_sdk"]
